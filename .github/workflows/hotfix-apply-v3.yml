name: Apply v0.3.1 Stability Hotfix v3

on:
  push:
    branches: [hotfix/fastfiles-v0.3.1-stability]
    paths: [.github/workflows/hotfix-apply-v3.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/fastfiles-v0.3.1-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source hotfixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          Path("components/PwaRegistration.tsx").write_text('''"use client";\n\nimport { useEffect } from "react";\n\nexport default function PwaRegistration() {\n  useEffect(() => {\n    if (!("serviceWorker" in navigator) || process.env.NODE_ENV !== "production") return;\n    let cancelled = false;\n    void navigator.serviceWorker.register("/sw.js").then((registration) => {\n      if (!cancelled) void registration.update();\n    }).catch(() => {\n      // FastFiles remains fully usable when service workers are unavailable.\n    });\n    return () => { cancelled = true; };\n  }, []);\n  return null;\n}\n''')

          Path("public/sw.js").write_text('''const CACHE_NAME = "fastfiles-shell-v0.3.1";\nconst APP_SHELL = ["/", "/qr", "/tools/image-convert", "/tools/watermark", "/icon.svg", "/manifest.webmanifest"];\n\nself.addEventListener("install", (event) => {\n  event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(APP_SHELL)));\n});\n\nself.addEventListener("activate", (event) => {\n  event.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith("fastfiles-") && key !== CACHE_NAME).map((key) => caches.delete(key)))).then(() => self.clients.claim()));\n});\n\nself.addEventListener("fetch", (event) => {\n  const request = event.request;\n  const url = new URL(request.url);\n  if (request.method !== "GET" || url.origin !== self.location.origin || !["http:", "https:"].includes(url.protocol)) return;\n  if (!["document", "script", "style", "font", "image", "worker"].includes(request.destination)) return;\n\n  event.respondWith(fetch(request).then((response) => {\n    if (response.ok && response.type === "basic") {\n      const copy = response.clone();\n      void caches.open(CACHE_NAME).then((cache) => cache.put(request, copy));\n    }\n    return response;\n  }).catch(() => caches.match(request).then((cached) => cached || (request.mode === "navigate" ? caches.match("/") : undefined))));\n});\n''')

          Path("lib/qr-tools.ts").write_text('''export function addLogoToSvg(svgMarkup: string, logoDataUrl: string, logoPercent: number) {\n  const viewBox = svgMarkup.match(/viewBox=["']([^"']+)["']/i)?.[1]?.trim().split(/\\s+/).map(Number);\n  if (!viewBox || viewBox.length !== 4 || viewBox.some((value) => !Number.isFinite(value))) return svgMarkup;\n  const [minX, minY, width, height] = viewBox;\n  const ratio = Math.min(0.3, Math.max(0.1, logoPercent / 100));\n  const logoWidth = width * ratio;\n  const logoHeight = height * ratio;\n  const padding = Math.max(width * 0.01, logoWidth * 0.1);\n  const x = minX + (width - logoWidth) / 2;\n  const y = minY + (height - logoHeight) / 2;\n  const overlay = `<rect x="${x - padding}" y="${y - padding}" width="${logoWidth + padding * 2}" height="${logoHeight + padding * 2}" rx="${padding * 0.35}" fill="#fff"/><image href="${logoDataUrl}" x="${x}" y="${y}" width="${logoWidth}" height="${logoHeight}" preserveAspectRatio="xMidYMid meet"/>`;\n  return svgMarkup.replace(/<\\/svg>\\s*$/i, `${overlay}</svg>`);\n}\n''')

          replace("app/globals.css", ".toolbar-actions button { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 8px; font-weight: 750; }", ".toolbar-actions button:not(.primary-button) { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 8px; font-weight: 750; }")
          replace("components/FastFilesApp.tsx", "FastFiles v0.2.1", "FastFiles v0.3.1")
          replace("components/FastFilesApp.tsx", "Convert JPG, PNG, WebP and supported AVIF", "Export JPG, PNG, WebP and AVIF when supported")
          replace("components/FastFilesApp.tsx", "แปลง JPG, PNG, WebP และ AVIF เมื่อเบราว์เซอร์รองรับ", "ส่งออก JPG, PNG, WebP และ AVIF เมื่อเบราว์เซอร์รองรับ")
          replace("components/FileQueue.tsx", "This image format is not supported in v0.2.", "This image format is not supported.")
          replace("components/FileQueue.tsx", "เวอร์ชันนี้ยังไม่รองรับรูปแบบภาพนี้", "ยังไม่รองรับรูปแบบภาพนี้")
          replace("components/StandaloneToolPage.tsx", 'values.push("image/jpeg", "image/png", "image/webp", "image/avif", ".jpg", ".jpeg", ".png", ".webp", ".avif");', 'values.push("image/jpeg", "image/png", "image/webp", ".jpg", ".jpeg", ".png", ".webp");')
          replace("components/StandaloneToolPage.tsx", '"PDF · JPG · PNG · WEBP · AVIF" : acceptsPdf ? "PDF" : "JPG · PNG · WEBP · AVIF"', '"PDF · JPG · PNG · WEBP" : acceptsPdf ? "PDF" : "JPG · PNG · WEBP"')
          replace("playwright.config.ts", "expect: { timeout: 10_000 },", "expect: { timeout: 20_000 },")

          qr = Path("components/QRGenerator.tsx")
          text = qr.read_text()
          import_marker = 'import { downloadBlob } from "@/lib/download";'
          if import_marker not in text:
              raise SystemExit("QR import marker not found")
          text = text.replace(import_marker, import_marker + '\nimport { addLogoToSvg } from "@/lib/qr-tools";', 1)
          marker = '''function loadImage(source: string) {\n  return new Promise<HTMLImageElement>((resolve, reject) => {\n    const image = new Image();\n    image.onload = () => resolve(image);\n    image.onerror = () => reject(new Error("Unable to load QR logo."));\n    image.src = source;\n  });\n}\n'''
          addition = marker + '''\nfunction fileToDataUrl(file: File) {\n  return new Promise<string>((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onerror = () => reject(new Error("Unable to read QR logo."));\n    reader.onload = () => resolve(String(reader.result));\n    reader.readAsDataURL(file);\n  });\n}\n'''
          if marker not in text:
              raise SystemExit("QR loadImage marker not found")
          text = text.replace(marker, addition, 1)
          old = '''  const downloadSvg = () => {\n    downloadBlob(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }), "fastfiles-qr.svg");\n  };'''
          new = '''  const downloadSvg = async () => {\n    const markup = logo ? addLogoToSvg(svg, await fileToDataUrl(logo), logoSize) : svg;\n    downloadBlob(new Blob([markup], { type: "image/svg+xml;charset=utf-8" }), "fastfiles-qr.svg");\n  };'''
          if old not in text:
              raise SystemExit("QR downloadSvg marker not found")
          qr.write_text(text.replace(old, new, 1))

          readme = Path("README.md")
          r = readme.read_text()
          heading = "## FastFiles v0.3.0 — Editing Experience & Product Quality"
          note = '''## FastFiles v0.3.1 — Stability Hotfix\n\n- Removed automatic page reloads when a service worker first takes control or updates.\n- Fixed PDF Organizer primary-action contrast and tightened accessibility regression coverage.\n- Added stable visual baselines for desktop, mobile, editor, watermark, organizer, result, and QR surfaces.\n- Preserved center logos in SVG QR downloads, matching PNG output.\n- Corrected visible version strings and clarified that AVIF is runtime-gated for export rather than advertised as a supported input.\n- Pinned a patched PostCSS 8 release through npm overrides while remaining on Next 15, with npm audit enforced by CI.\n\n'''
          if heading not in r:
              raise SystemExit("README v0.3.0 heading not found")
          readme.write_text(r.replace(heading, note + heading, 1))

          changelog = Path("CHANGELOG.md")
          c = changelog.read_text()
          if "## 0.3.1" not in c:
              insertion = '''## 0.3.1\n\n- Stabilized PWA service-worker activation without automatic reloads.\n- Fixed organizer action contrast, QR SVG logo export parity, version labels, and AVIF input messaging.\n- Added/updated visual baselines and release-gate checks.\n- Patched transitive PostCSS security advisories without a Next major-version jump.\n\n'''
              first_heading = c.find("## ")
              changelog.write_text(c[:first_heading] + insertion + c[first_heading:] if first_heading >= 0 else c + "\n" + insertion)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/pwa-stability.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          const png = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=", "base64");

          test("service worker activation preserves an in-memory file session", async ({ page }) => {
            await page.goto("/");
            await page.locator('input[type="file"]').first().setInputFiles({ name: "pwa-session.png", mimeType: "image/png", buffer: png });
            const queue = page.getByTestId("file-queue");
            await expect(queue).toBeVisible();
            await expect(queue.getByText("pwa-session.png")).toBeVisible();
            const urlBefore = page.url();
            await page.evaluate(async () => { if ("serviceWorker" in navigator) await navigator.serviceWorker.ready; });
            await page.waitForTimeout(750);
            await expect(queue).toBeVisible();
            await expect(queue.getByText("pwa-session.png")).toBeVisible();
            expect(page.url()).toBe(urlBefore);
          });
          EOF

          cat > tests/unit/qr-svg.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { addLogoToSvg } from "../../lib/qr-tools";

          describe("QR SVG logo composition", () => {
            it("embeds the logo inside the QR viewBox", () => {
              const svg = '<svg viewBox="0 0 100 100"><path d="M0 0h100v100z"/></svg>';
              const output = addLogoToSvg(svg, "data:image/png;base64,AAAA", 20);
              expect(output).toContain('<image href="data:image/png;base64,AAAA"');
              expect(output).toContain('<rect');
              expect(output.endsWith("</svg>")).toBe(true);
            });
          });
          EOF

      - name: Patch package metadata and lockfile
        shell: bash
        run: |
          npm pkg set version=0.3.1
          npm pkg set overrides.postcss=8.5.23
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --audit-level=moderate

      - name: Static verification
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build

      - name: Chromium regression and visual baselines
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep-invert @visual
          npx playwright test tests/visual-regression.spec.ts --project=chromium --update-snapshots
          npm run test:visual

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-probe.yml .github/workflows/hotfix-apply.yml .github/workflows/hotfix-apply-v2.yml .github/workflows/hotfix-apply-v3.yml
          git config user.name "KZNowhere"
          git config user.email "supavich.032547@gmail.com"
          git add -A
          git commit -m "fix: stabilize FastFiles v0.3.1"
          git push origin HEAD:hotfix/fastfiles-v0.3.1-stability
