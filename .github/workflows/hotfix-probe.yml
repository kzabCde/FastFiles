name: v0.3.1 Hotfix Probe

on:
  push:
    branches: [hotfix/fastfiles-v0.3.1-stability]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit details
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: report.vulnerabilities }, null, 2));
          NODE
