name: Clean v0.3.1 Hotfix Artifacts

on:
  push:
    branches: [hotfix/fastfiles-v0.3.1-stability]
    paths: [.github/workflows/hotfix-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/fastfiles-v0.3.1-stability
          fetch-depth: 0
      - name: Remove generated reports and protect branch from future test artifacts
        shell: bash
        run: |
          git rm -r --ignore-unmatch playwright-report test-results
          git checkout origin/main -- next-env.d.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('.gitignore')
          text = p.read_text()
          block = '\n# playwright generated artifacts\n/playwright-report/\n/test-results/\n'
          if '/playwright-report/' not in text:
              text = text.rstrip() + block
          p.write_text(text)
          PY
          rm -f .github/workflows/hotfix-cleanup.yml
          git config user.name "KZNowhere"
          git config user.email "supavich.032547@gmail.com"
          git add -A
          git commit -m "chore: exclude generated Playwright artifacts"
          git push origin HEAD:hotfix/fastfiles-v0.3.1-stability
