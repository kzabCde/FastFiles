name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply final v0.2 QA fixes
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          # Allow language switching without leaving an active workspace.
          p = Path('components/ToolWorkspace.tsx')
          s = p.read_text()
          s = s.replace(
              '  onBack: () => void;\n  onReset: () => void;\n};',
              '  onBack: () => void;\n  onReset: () => void;\n  onToggleLanguage: () => void;\n};'
          )
          s = s.replace(
              'export default function ToolWorkspace({ tool, files, language, onBack, onReset }: Props) {',
              'export default function ToolWorkspace({ tool, files, language, onBack, onReset, onToggleLanguage }: Props) {'
          )
          old = '<button className="text-button" onClick={onReset} disabled={busy}>{language === "th" ? "ไฟล์ใหม่" : "NEW FILES"}</button>'
          new = '<div className="workspace-head-actions"><button className="chip-button workspace-language" onClick={onToggleLanguage} disabled={busy} aria-label={language === "en" ? "Switch to Thai" : "Switch to English"}>{language === "en" ? "TH" : "EN"}</button><button className="text-button" onClick={onReset} disabled={busy}>{language === "th" ? "ไฟล์ใหม่" : "NEW FILES"}</button></div>'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('components/FastFilesApp.tsx')
          s = p.read_text()
          old = 'return <ToolWorkspace tool={activeTool} files={files} language={language} onBack={() => setActiveTool(null)} onReset={reset} />;'
          new = 'return <ToolWorkspace tool={activeTool} files={files} language={language} onToggleLanguage={() => setLanguage((value) => value === "en" ? "th" : "en")} onBack={() => setActiveTool(null)} onReset={reset} />;'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('app/v02.css')
          s = p.read_text()
          css = '''\n.workspace-head-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }\n.workspace-language { flex: 0 0 auto; }\n@media (max-width: 640px) {\n  .workspace-head-actions { gap: 4px; }\n  .workspace-head-actions .text-button { padding-inline: 6px; }\n}\n'''
          if '.workspace-head-actions {' not in s:
              s += css
          p.write_text(s)

          p = Path('tests/v02.spec.ts')
          s = p.read_text()
          s = s.replace('await expect(page.getByText(/empty|ไม่มีข้อมูล/i)).toBeVisible();', 'await expect(page.getByText("This file is empty.", { exact: true })).toBeVisible();')
          s = s.replace('await expect(page.getByText("การตั้งค่า")).toBeVisible();', 'await expect(page.getByText("การตั้งค่า", { exact: true })).toBeVisible();')

          marker = 'test("language can be switched after entering a workspace"'
          if marker not in s:
              s += r'''\n\ntest("language can be switched after entering a workspace", async ({ page }) => {\n  await page.goto("/");\n  await upload(page, [{ name: "workspace-language.png", mimeType: "image/png", buffer: png }]);\n  await page.getByRole("button", { name: /Image Converter/i }).first().click();\n  await expect(page.getByText("SETTINGS", { exact: true })).toBeVisible();\n  await page.getByRole("button", { name: "Switch to Thai" }).click();\n  await expect(page.locator("html")).toHaveAttribute("lang", "th");\n  await expect(page.getByText("การตั้งค่า", { exact: true })).toBeVisible();\n  await page.getByRole("button", { name: "Switch to English" }).click();\n  await expect(page.locator("html")).toHaveAttribute("lang", "en");\n  await expect(page.getByText("SETTINGS", { exact: true })).toBeVisible();\n});\n\ntest("partial image batch preserves successes and can retry only failed files", async ({ page }) => {\n  await page.goto("/");\n  await upload(page, [\n    { name: "success.png", mimeType: "image/png", buffer: png },\n    { name: "retry.png", mimeType: "image/png", buffer: png },\n  ]);\n  await page.getByRole("button", { name: /Image Converter/i }).first().click();\n\n  await page.evaluate(() => {\n    const original = HTMLCanvasElement.prototype.toBlob;\n    let calls = 0;\n    HTMLCanvasElement.prototype.toBlob = function(callback, type, quality) {\n      calls += 1;\n      if (calls === 2) {\n        callback(null);\n        return;\n      }\n      return original.call(this, callback, type, quality);\n    };\n  });\n\n  const firstDownload = page.waitForEvent("download");\n  await page.getByRole("button", { name: /PROCESS 2 FILES/i }).click();\n  await firstDownload;\n  const result = page.getByTestId("result-center");\n  await expect(result).toBeVisible();\n  await expect(result).toContainText("PARTIAL SUCCESS");\n  await expect(result).toContainText("success.webp");\n  await expect(result).toContainText("retry.png");\n  await expect(result.getByRole("button", { name: /Retry failed/i })).toBeVisible();\n\n  const retryDownload = page.waitForEvent("download");\n  await result.getByRole("button", { name: /Retry failed/i }).click();\n  const retried = await retryDownload;\n  expect(retried.suggestedFilename()).toMatch(/retry\.webp$/i);\n  await expect(page.getByTestId("result-center")).toContainText("RETRY COMPLETED");\n  await expect(page.getByTestId("result-center")).toContainText("retry.webp");\n});\n'''
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ToolWorkspace.tsx components/FastFilesApp.tsx app/v02.css tests/v02.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: close v0.2 workflow QA gaps"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
